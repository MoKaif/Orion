<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 88" role="img" aria-label="Orion Knowledge OS">
  <g transform="translate(0 4) scale(.625)">
  <defs>
    <linearGradient id="ring" x1="31" y1="10" x2="89" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f8ff"/><stop offset=".42" stop-color="#b4d5ff"/>
      <stop offset=".78" stop-color="#6685f9"/><stop offset="1" stop-color="#abcaff"/>
    </linearGradient>
    <radialGradient id="shade" cx="29%" cy="76%" r="84%">
      <stop stop-color="#040a10"/><stop offset=".57" stop-color="#070e19"/>
      <stop offset=".78" stop-color="#182842"/><stop offset=".93" stop-color="#637fa9"/>
      <stop offset="1" stop-color="#e1edff"/>
    </radialGradient>
    <linearGradient id="moon" x2=".45" y2="1">
      <stop stop-color="#f7fbff"/><stop offset=".43" stop-color="#bfdcff"/><stop offset="1" stop-color="#7399ff"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
