  <text x="91" y="46" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="1">Orion</text><text x="93" y="66" fill="#8B98AE" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="4">KNOWLEDGE OS</text>
