# Orion as an on-demand Docker service, controlled on/off by NoxCtl.
#   NoxCtl start  -> docker compose -f this up -d
#   NoxCtl stop   -> docker compose -f this down
#
# Host networking is deliberate: Orion's local brain is host Ollama at
# localhost:11434, and host mode both reaches it and publishes Orion on the
# host's :8020 for LAN devices — no port mapping or bridge gymnastics.
services:
  orion:
    build: .
    container_name: orion            # must match services.yaml container_name for NoxCtl status
    restart: unless-stopped          # survives reboots; a NoxCtl "stop" (compose down) stays down
    network_mode: host
    volumes:
      - ./data:/app/data             # SQLite world model + usage.json + herald.db (the outbox)
      - ./data/models:/tmp/fastembed_cache  # fastembed ONNX model — downloaded once, reused
      # settings/models/jobs/herald + gitignored secrets.json, which is where the cloud keys
      # and Herald's Gmail app password live. Never baked into a layer (see .dockerignore).
      - ./config:/app/config
      # Obsidian vault, mounted at the same path as on the host so settings.json's
      # vault.path works both bare-metal and in-container. Read-write: Curator applies
      # user-approved grammar fixes here (backups land in ./data/curator_backups).
      - /home/nox/Nox:/home/nox/Nox
      # The code Maintainer watches, mounted at the same path for the same reason — and
      # READ-ONLY, which is the whole safety story: Orion reads every repo to propose work
      # and is physically unable to change one. Writing is the host runner's job, and only
      # ever inside its own worktrees (see scripts/maintainer_runner.py).
      - /home/nox/Developing-Environment:/home/nox/Developing-Environment:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Left unset on purpose: Orion applies settings.json's identity.timezone at startup, so
      # the clock has one source of truth for both bare-metal and container. Set TZ here only
      # to deliberately override that (it wins).
      #
      # Outbound SMTP (Herald -> smtp.gmail.com:465) works without extra config because this
      # is host networking; there is no bridge to punch through.
